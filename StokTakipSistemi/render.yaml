# Render Blueprint — StokTakip API
# https://render.com/docs/blueprint-spec
# Not: Render'ın native PHP runtime'ı yok; kök dizindeki Dockerfile kullanılır.
services:
  - type: web
    name: stoktakip-api
    runtime: docker
    plan: free
    rootDir: StokTakipSistemi
    dockerfilePath: StokTakipSistemi/Dockerfile
    dockerContext: StokTakipSistemi
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://stoktakip-api.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: stoktakip_db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: stoktakip_db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: stoktakip_db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: stoktakip_db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stoktakip_db
          property: password

databases:
  - name: stoktakip_db
    plan: free
    databaseName: stoktakip
    user: stoktakip

# NOT: Ücretsiz planda kalıcı disk yoktur; storage/app/private içine yüklenen
# irsaliye dosyaları yeniden başlatmada silinir. Kalıcı çözüm (Supabase Storage /
# Cloudflare R2 / S3) roadmap'te.
